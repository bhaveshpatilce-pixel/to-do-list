<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | To-Do Elite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container dashboard-container">
        <div class="glass-card">
            <header class="header-actions">
                <div class="user-info">
                    <h1>My Tasks</h1>
                    <p class="subtitle">Welcome back, <span id="userName">User</span></p>
                </div>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </header>

            <div class="todo-input-group">
                <input type="text" id="newTaskInput" placeholder="Add a new task..." maxlength="100">
                <button class="btn-primary" id="addTaskBtn" style="width: auto; padding: 0 1.5rem;">Add</button>
            </div>

            <div class="filter-group" style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
                <button class="filter-btn active" data-filter="all" style="width: auto; padding: 0.4rem 1rem; font-size: 0.8rem; background: rgba(255,255,255,0.05);">All</button>
                <button class="filter-btn" data-filter="pending" style="width: auto; padding: 0.4rem 1rem; font-size: 0.8rem; background: rgba(255,255,255,0.05);">Pending</button>
                <button class="filter-btn" data-filter="completed" style="width: auto; padding: 0.4rem 1rem; font-size: 0.8rem; background: rgba(255,255,255,0.05);">Completed</button>
            </div>

            <div class="spinner" id="loader"></div>
            <div id="todoList">
                <!-- Tasks will be injected here -->
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <p>No tasks found. Start by adding one!</p>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="js/script.js"></script>
</body>
</html>
