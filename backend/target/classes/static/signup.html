<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | To-Do Elite</title>
    <meta name="description" content="Join To-Do Elite and start managing your tasks with ease.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1>Create Account</h1>
            <p class="subtitle">Join To-Do Elite and stay organized</p>
            
            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" id="signupBtn">
                    <span class="btn-text-content">Create Account</span>
                </button>
            </form>
            
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
                Already have an account? <a href="index.html" style="color: var(--accent); text-decoration: none;">Sign in here</a>
            </p>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const btn = document.getElementById('signupBtn');
            const btnText = btn.querySelector('.btn-text-content');
            btnText.textContent = 'Creating Account...';
            btn.disabled = true;

            try {
                const response = await fetch('http://localhost:8080/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showToast('Account created successfully!', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    showToast(data.error || 'Signup failed', 'error');
                    btnText.textContent = 'Create Account';
                    btn.disabled = false;
                }
            } catch (err) {
                showToast('Server connection failed', 'error');
                btnText.textContent = 'Create Account';
                btn.disabled = false;
            }
        });

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.borderColor = type === 'success' ? 'var(--success)' : 'var(--danger)'; 
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
